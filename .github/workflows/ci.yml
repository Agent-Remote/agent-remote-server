name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent_remote
          POSTGRES_PASSWORD: agent_remote
          POSTGRES_DB: agent_remote_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_remote -d agent_remote_integration"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      AGENT_REMOTE_INTEGRATION_DATABASE_URL: postgresql+asyncpg://agent_remote:agent_remote@127.0.0.1:5432/agent_remote_integration
      AGENT_REMOTE_INTEGRATION_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.3.1
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.13"
      - run: uv sync
      - name: Audit locked production dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes \
            --output-file "$RUNNER_TEMP/server-requirements.txt"
          uvx --from pip-audit==2.9.0 pip-audit \
            --requirement "$RUNNER_TEMP/server-requirements.txt" \
            --format json \
            --output pip-audit.json
      - name: Upload dependency vulnerability report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: agent-remote-server-pip-audit
          path: pip-audit.json
          if-no-files-found: error
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - name: Generate coverage report
        run: uv run pytest --cov=agent_remote_server --cov-report=xml:coverage.xml --cov-fail-under=70
      - name: Enforce documentation contracts
        run: uv run python scripts/check_docstrings.py
      - run: git diff --check
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./coverage.xml
          use_oidc: true
